<div class="page-shell">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="page-title">Products</h2>
      <p class="page-kicker">Browse our latest products.</p>
    </div>

    <span class="badge bg-primary fs-6"> {{ totalProducts }} Products </span>
  </div>

  <!-- Search -->
  <div class="soft-card p-3 mb-4">
    <div class="input-group">
      <span class="input-group-text bg-white">
        <i class="bi bi-search"></i>
      </span>

      <input
        type="text"
        class="form-control"
        placeholder="Search Product..."
        [(ngModel)]="searchText"
        (input)="searchProducts()"
      />
    </div>
  </div>

  <!-- Loading -->

  <div *ngIf="isLoading" class="text-center my-5">
    <div class="spinner-border text-primary" role="status"></div>

    <h5 class="mt-3">Loading Products...</h5>
  </div>

  <!-- Error -->

  <div *ngIf="hasError" class="alert alert-danger">
    Unable to fetch products.
  </div>

  <!-- No Products -->

  <div
    *ngIf="!isLoading && filteredProducts.length === 0"
    class="alert alert-warning text-center"
  >
    No Products Found.
  </div>

  <!-- Product Grid -->
  <cdk-virtual-scroll-viewport itemSize="420" class="viewport">
    <div class="product-item" *cdkVirtualFor="let product of filteredProducts">
      <div class="card product-card">
        <img [src]="product.image" class="product-image" />

        <div class="card-body">
          <h5>
            {{ product.name }}
          </h5>

          <p>
            {{ product.brand }}
          </p>

          <span class="badge bg-secondary">
            {{ product.category }}
          </span>

          <h4 class="price mt-3">₹ {{ product.price }}</h4>
        </div>
      </div>
    </div>
  </cdk-virtual-scroll-viewport>

  <div *ngIf="isLoadingMore" class="text-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <div class="text-center my-4" *ngIf="!hasMore && filteredProducts.length">
    <h5>🎉 You've reached the end.</h5>
  </div>
</div>
